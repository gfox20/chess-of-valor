<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  html,body{background:#0f0a04;}
  body{display:flex;justify-content:center;min-height:100vh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #root{width:100%;max-width:420px;}

  img{-webkit-user-drag:none;user-select:none;}

  @keyframes ring{0%{transform:scale(0.5);opacity:0.9}100%{transform:scale(1.25);opacity:0}}

  @keyframes flashOut{0%{opacity:1}100%{opacity:0}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
